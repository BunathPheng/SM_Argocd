{{- $es := .Values.externalSecret -}}
{{- if .Values.redis.auth.existingSecret }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.redis.auth.existingSecret }}
  annotations:
    # Wave -1: Argo CD has a built-in health check for ExternalSecret, so it waits until
    # ESO has actually populated the Secret before starting the Redis workload in wave 0.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.storeName }}
    kind: {{ $es.storeKind }}
  target:
    name: {{ .Values.redis.auth.existingSecret }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.redis.auth.existingSecretPasswordKey }}
      remoteRef:
        key: {{ $es.path }}
        property: password
{{- end }}

{{- if and .Values.redis.auth.acl.userSecret .Values.redis.auth.acl.users }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.redis.auth.acl.userSecret }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.storeName }}
    kind: {{ $es.storeKind }}
  target:
    name: {{ .Values.redis.auth.acl.userSecret }}
    creationPolicy: Owner
  data:
    # "Keys must match usernames" — the chart looks up each ACL user by name in this Secret.
    {{- range .Values.redis.auth.acl.users }}
    - secretKey: {{ .username }}
      remoteRef:
        key: {{ $es.aclPath }}
        property: {{ .username }}
    {{- end }}
{{- end }}
