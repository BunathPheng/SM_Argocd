# OpenBao is API-compatible with Vault, so ESO's built-in `vault` provider works unchanged.
#
# Cluster-scoped so every namespace can reference it. Apply once per destination cluster.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: openbao-backend
spec:
  provider:
    vault:
      server: https://openbao.openbao.svc.cluster.local:8200
      # kv-v2 mount point, without the "data/" segment: ESO inserts it automatically.
      path: secret
      version: v2
      auth:
        # No static token anywhere — ESO exchanges its ServiceAccount JWT for a
        # short-lived OpenBao token.
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
