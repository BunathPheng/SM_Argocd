# Way 1 — a plain `helm:` source. No plugin, so the repo-server needs no OpenBao access
# and no secret value ever passes through Argo CD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/myorg/SM_Argocd.git
    targetRevision: main
    path: examples/redis-eso/chart
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
